name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: rustfmt, clippy

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake pkg-config libssl-dev libvulkan-dev vulkan-tools

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build (wasm32)
      run: cargo build --release --target wasm32-unknown-unknown --locked -p game-client -p game-sim -p game-net

    - name: Run tests
      run: cargo test --locked

    - name: Run clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings

    # game-client product modules are wasm32-only; host clippy skips their bodies.
    - name: Run clippy (wasm32)
      run: cargo clippy -p game-client --target wasm32-unknown-unknown --locked -- -D warnings

    - name: Run fmt
      run: cargo fmt --all -- --check

    - name: Build Docker image
      run: |
        docker build -f infra/docker/wasm-builder/Dockerfile -t shooter-game-wasm-builder .

  node:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Format check
      run: npm run format:check

    - name: Typecheck
      run: npm run typecheck
