[package]
name = "game-server"
version = "0.1.0"
edition = "2021"
description = "Native multiplayer host (WebTransport)"

[[bin]]
name = "game-server"
path = "src/main.rs"

[dependencies]
game-net = { path = "../game-net" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
wtransport = { version = "0.7", features = ["self-signed"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
