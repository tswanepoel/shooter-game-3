[package]
name = "game-server"
version = "0.1.0"
edition = "2021"
description = "Native multiplayer authority host"

[[bin]]
name = "game-server"
path = "src/main.rs"

[dependencies]
game-net = { path = "../game-net" }
game-sim = { path = "../game-sim" }
glam = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
