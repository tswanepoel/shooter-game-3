[package]
name = "game-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["debug-tools"]
# In-engine debug shell, command/cvar registry, host bridge, blaster lineup.
# Production strip: wasm-pack build -- --no-default-features
# Self body/blaster (013) always ships; kit load deps are not debug-gated.
debug-tools = ["dep:egui", "dep:egui-wgpu"]

[dependencies]
wgpu = "24"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.67", features = [
  "console",
  "BinaryType",
  "Document",
  "DomRect",
  "Element",
  "ErrorEvent",
  "HtmlCanvasElement",
  "HtmlElement",
  "KeyboardEvent",
  "Location",
  "MessageEvent",
  "MouseEvent",
  "Performance",
  "Request",
  "Response",
  "WebSocket",
  "WheelEvent",
  "Window",
] }
console_error_panic_hook = "0.1"
glam = "0.24"
bytemuck = { version = "1", features = ["derive"] }
game-sim = { path = "../game-sim" }
game-net = { path = "../game-net" }
egui = { version = "0.31", optional = true }
egui-wgpu = { version = "0.31", optional = true }
# Kit marks KHR_materials_unlit as required; enable so parse does not reject the GLBs.
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "KHR_materials_unlit", "extensions"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
